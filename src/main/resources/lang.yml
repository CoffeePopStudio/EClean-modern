prefix: "<gray>[<green>EClean</green>]</gray>"
debug_prefix: "<gray>[<gold>ECleanDebug</gold>]</gray>"

debug:
  console_enable: "<white>已临时(修改config.yml永久设置)<green>启用</green><aqua>Debug</aqua><white>, 下次重启前你将会收到<aqua>Debug</aqua><white>消息, 再使用一次此指令以<red>禁用</red></white>"
  console_disable: "<white>已临时(修改config.yml永久设置)<red>禁用</red><aqua>Debug</aqua><white>, 下次重启前你不会收到<aqua>Debug</aqua><white>消息, 再使用一次此指令以<green>启用</green></white>"
  player_enable: "<white>已<green>启用</green><aqua>Debug</aqua><white>, 你将会收到<aqua>Debug</aqua><white>消息, 再使用一次此指令以<red>禁用</red></white>"
  player_disable: "<white>已<red>禁用</red><aqua>Debug</aqua><white>, 你不会收到<aqua>Debug</aqua><white>消息, 再使用一次此指令以<green>启用</green></white>"

warn:
  out_of_range: "清理前的消息`{message}`<yellow>设置的时长超过清理间隔`{duration}`<yellow>, 请在设置中修改(此消息将不会被发送)</yellow>"
  invalid_number: "清理消息的时长只能是小于清理间隔的数字"

hook:
  enable: "扫描到依赖{plugin}, 已启用相关支持"
  disable: "未扫描到依赖{plugin}, 已禁用"

message:
  noperm: "<red>无权限</red>"
  non_player: "<red>仅玩家可用</red>"
  unknown_command: "<red>未知指令</red>"
  invalid_args: "<red>无效参数</red>"
  invalid_world: "<red>不存在名为`{world}`的世界</red>"
  invalid_number: "{number}不是有效数字"
  invalid_config: "<red>配置文件`{file}`格式错误</red>"
  invalid_entity_type: "<yellow>{type}</yellow><red>不是有效的实体类型</red>"

menu:
  dense:
    title: "<gold>密集实体检测</gold>"
    item:
      name: "<gold>{type}</gold>"
      lore: |-
        <white>{amount}</white>
        <white>{chunk}</white>
        <green>左键点击传送</green>
        <dark_red>右键点击清除该区块的所有该实体</dark_red>
    prev:
      name: "<gold>上一页</gold>"
      lore: |-
        <white>点击前往上一页</white>
    next:
      name: "<gold>下一页</gold>"
      lore: |-
        <white>点击前往下一页</white>
    temp:
      name: "<gold>点击切换临时传送功能</gold>"
      lore: |-
        <white>传送完成30s后传送回当前位置</white>
        <white>临时传送非切换功能, 启用后仅下次传送生效</white>
        <white>当前状态为{status}</white>
      status:
        true: "<green>启用</green>"
        false: "<red>禁用</red>"
    clean: "清理区块({chunk})的{type}, 共{count}个"
  trashcan:
    title: "<gold>临时垃圾桶</gold>"
    item:
      lore: |-
        <white>共{amount}个</white>
        <green>左键点击拿取一个</green>
        <green>右键点击拿取半组</green>
        <green>Shift+左键点击拿取一组</green>
    prev:
      name: "<gold>上一页</gold>"
      lore: |-
        <white>点击前往上一页</white>
    next:
      name: "<gold>下一页</gold>"
      lore: |-
        <white>点击前往下一页</white>

trash:
  title: "<gold>共享垃圾桶 - 先到先得, 定期清空</gold>"

command:
  reload_done: "<green>重载完成</green>"
  trash_disable: "<green>垃圾桶功能已被禁用</green>"
  trash_open: "<green>已打开垃圾桶</green>"
  trash_clean_done: "<green>垃圾桶已清空</green>"
  trash_full: "<yellow>垃圾桶已满, 部分物品无法放入</yellow>"
  clean_done: "<green>共清理<gold>{count}</gold>个实体</green>"
  teleport:
    done: "<green>传送完成</green>"
    temp: "<green>传送完成, 将在30秒后传送回之前的位置</green>"
    cover: "<green>传送完成, 将在30秒后传送回上一个传送的返回位置</green>"
    back: "<green>已返回传送前的位置</green>"
  stats:
    spacing: "<gray>, </gray>"
    content: "<white>{type}: {count}个</white>"
    empty: "<red>无结果</red>"
    world: |-
      <white>世界<green>{world}</green>共加载区块{count}个(强加载{force}个)</white>
      <aqua>实体统计信息:</aqua>
      {entity}
    entity: |-
      <white>实体<yellow>{type}</yellow>的统计信息</white>
      {entity}
  usage:
    debug: "<green>/eclean debug</green> <white>切换debug消息的接受与否</white>"
    reload: "<green>/eclean reload</green> <white>重载插件</white>"
    trash: "<green>/eclean trash</green> <white>打开垃圾桶</white>"
    players: "<green>/eclean players</green> <white>展示玩家及其所在的位置</white>"
    show: "<green>/eclean show</green> <white>打开密集实体统计信息菜单</white>"
    stats: |-
      <green>/eclean stats</green> <white>统计当前所在世界的实体和区块统计</white>
      <green>/eclean stats <世界名></green> <white>统计实体和区块统计</white>
    entity: |-
      <green>/eclean entity <实体名></green> <white>统计当前世界每个区块的指定实体</white>
      <green>/eclean entity <实体名> <世界名></green> <white>统计指定世界个区块的指定实体</white>
      <green>/eclean entity <实体名> <世界名> <纳入统计所需数量></green> <white>统计指定世界个区块的指定实体并隐藏数量不超过指定数量的内容</white>
    clean: |-
      <green>/eclean clean</green> <white>立刻执行一次清理(执行清理通知, 按照配置文件中的规则)</white>
      <green>/eclean clean entity</green> <white>立刻执行一次实体清理(执行清理通知, 按照配置文件中的规则)</white>
      <green>/eclean clean entity <世界名></green> <white>立刻在指定世界执行一次实体清理(<red>不</red><white>执行清理通知, 按照配置文件中的规则)</white>
      <green>/eclean clean drop</green> <white>立刻执行一次掉落物清理(执行清理通知, 按照配置文件中的规则)</white>
      <green>/eclean clean drop <世界名></green> <white>立刻在指定世界执行一次掉落物清理(<red>不</red><white>执行清理通知, 按照配置文件中的规则)</white>
      <green>/eclean clean chunk</green> <white>立刻执行一次密集实体清理(执行清理通知, 按照配置文件中的规则)</white>
      <green>/eclean clean chunk <世界名></green> <white>立刻在指定世界执行一次密集实体清理(<red>不</red><white>执行清理通知, 按照配置文件中的规则)</white>
