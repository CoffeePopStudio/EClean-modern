# 垃圾桶功能总开关
enabled: true
# 是否将掉落物清理时清理掉的物品收集进垃圾桶
collectFromDropCleanup: true
# 垃圾桶中每个聚合条目的存活时间(秒), 到期后该条目自动消失
# null 表示条目永不过期
clearIntervalSeconds: 600
# 物品聚合配置: 相同物品自动堆叠为单个条目, 一格显示一类物品的总数量, 数量不受堆叠上限限制
stacking:
  # 聚合开关: true=相同物品合并为单个条目(数量不限); false=每次放入独立条目不合并
  enabled: true
  # 是否按数量降序排列条目
  sortByCount: true
  # 是否在条目 lore 中显示剩余存活时间
  showRemainingTimeInLore: true
despawnRecovery:
  enabled: false
  disabledWorlds:
    - "not_recovered_world"
  matchers:
    - "DIAMOND[A-Z_]*"
    - "NETHERITE[A-Z_]*"
    - "[A-Z_]*SHULKER_BOX"
    - "[A-Z_]*(HEAD|SKULL)"
    - "SHULKER_SHELL"
    - "BEACON"
    - "(ENCHANTED_)?GOLDEN_APPLE"
    - "TRIDENT"
    - "TOTEM_OF_UNDYING"
    - "ENDER_CHEST"
    - "DRAGON_EGG"
    - "ELYTRA"
