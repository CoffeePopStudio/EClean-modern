enabled: true
disabledWorlds:
  - "not_cleaned_world"
finishMessage: "<green>生物清理完成, 已清理{clean}/{all}</green>"
settings:
  cleanNamed: false
  cleanLeashed: false
  cleanMounted: false
blacklistMode: true
matchers:
  - "BLAZE"
  - "EVOKER"
  - "GHAST"
  - "(GLOW_)?SQUID"
  - "PHANTOM"
  - "PILLAGER"
# 只清理距离最近玩家超过该距离的生物；不填或 null 表示不限制
maxDistance: null
# 按实体类型单独覆盖
typeRules:
  ZOMBIE:
    enabled: true
    maxDistance: 10
# 保护已驯服的宠物（狗、猫等）
protectTamed: true
# 保护悦灵 Allay
protectAllay: true
