intervalSeconds: 600
countdownMessages:
  60: "<white>将在1分钟后进行清理</white>"
  30: "<white>将在30秒后进行清理</white>"
  10: "<white>将在10秒后进行清理</white>"
  0: "<white>正在清理</white>"
cleanWhenNoPlayers: true
broadcastWhenNoPlayers: true
# 实体数量异常提醒
alertEnabled: false
alertEntityThreshold: 500
alertCheckIntervalSeconds: 600
alertFormat: "<red>实体数量异常</red> <white>{world} 的 {type} 数量达到 {count}</white>"
